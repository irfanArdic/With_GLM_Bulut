<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kayıt Ol</title>
<style>
body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
.box { background: #16213e; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
h2 { color: #667eea; text-align: center; margin-bottom: 20px; }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-size: 12px; color: #aaa; }
input, select { width: 100%; padding: 12px; border: 1px solid #333; background: #0f172a; color: #fff; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
input:focus { border-color: #667eea; outline: none; }
.row { display: flex; gap: 10px; }
.col { flex: 1; }
button { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
button:disabled { background: #555; cursor: not-allowed; }
.status { padding: 12px; border-radius: 8px; text-align: center; margin-top: 15px; font-weight: bold; display: none; }
.s-ok { background: #4caf50; color: white; display: block; }
.s-err { background: #f44336; color: white; display: block; }
.s-wait { background: #ff9800; color: white; display: block; }
.tel-wrap { display: flex; align-items: center; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
.tel-prefix { background: #333; padding: 12px; font-weight: bold; color: #aaa; }
.tel-wrap input { border: none; border-radius: 0; }
</style>
</head>
<body>
<div class="box">
    <h2>📝 Site Sakini Kaydı</h2>
    
    <div class="form-group">
        <label>AD SOYAD</label>
        <input type="text" id="adInput" placeholder="Adınız ve soyadınızı girin">
    </div>
    
    <div class="form-group">
        <label>TELEFON NUMARASI</label>
        <div class="tel-wrap">
            <span class="tel-prefix">+90</span>
            <input type="tel" id="telInput" maxlength="10" placeholder="5xx xxx xx xx">
        </div>
    </div>

    <div class="row">
        <div class="col form-group">
            <label>BLOK NO</label>
            <input type="number" id="blokInput" value="1" min="1">
        </div>
        <div class="col form-group">
            <label>DAİRE NO</label>
            <input type="number" id="daireInput" value="1" min="1">
        </div>
    </div>
    
    <div class="row">
        <div class="col form-group">
            <label>KAPI</label>
            <select id="kapiSelect">
                <option value="1">1. Kapı</option>
                <option value="2">2. Kapı</option>
                <option value="3">3. Kapı</option>
                <option value="4">4. Kapı</option>
            </select>
        </div>
        <div class="col form-group">
            <label>ROL</label>
            <select id="rolSelect">
                <option value="0">Sakin</option>
                <option value="1">Personel</option>
                <option value="2">Yönetici</option>
            </select>
        </div>
    </div>
    
    <button id="kayitBtn" onclick="kayitOl()">Kaydı Tamamla</button>
    
    <div class="status" id="status"></div>
</div>

<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script src="kapibus.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const link = urlParams.get('l');
const chipId = urlParams.get('id');
const slot = parseInt(urlParams.get('s') || '0');

let client = null;
let didBase = null;
let deviceIDHex = null;
let waitingAck = false;
let ackTimeout = null;

function setStatus(cls, msg) {
    const s = document.getElementById('status');
    s.className = 'status ' + cls;
    s.textContent = msg;
}

async function init() {
    if (!link || !chipId) {
        setStatus('s-err', 'Hata: Davetiye Linki eksik!');
        document.getElementById('kayitBtn').disabled = true;
        return;
    }

    const deviceID = Array.from(crypto.getRandomValues(new Uint8Array(4)));
    deviceIDHex = Kapibus.bytesToHex(deviceID);
    didBase = await Kapibus.generateDIDBase(link, deviceIDHex);

    client = mqtt.connect('wss://49de32fbb15f4b4ead7a5919fb255492.s1.eu.hivemq.cloud:8884/mqtt', {
        clientId: 'web_reg_' + Math.random().toString(36).substring(2),
        username: 'ESP8266_buton',
        password: 'EDCrfv01'
    });

    const topicYanit = `esp8266/kapi/${chipId}/kayit/yanit/${deviceIDHex}`;

    client.on('connect', () => {
        client.subscribe(topicYanit);
        setStatus('s-ok', 'Sistem hazır. Lütfen bilgilerinizi girip kayıt olun.');
    });

    client.on('message', (topic, message) => {
        const msgBytes = new Uint8Array(message);
        if (waitingAck && msgBytes.length === 1) {
            clearTimeout(ackTimeout);
            waitingAck = false;
            if (msgBytes[0] === 0x01) {
                setStatus('s-ok', 'Kayıt Başarılı! Artık kapıyı açabilirsiniz.');
                document.getElementById('kayitBtn').disabled = true;
            } else {
                setStatus('s-err', 'Kayıt Başarısız! Slot dolu veya hatalı.');
                document.getElementById('kayitBtn').disabled = false;
            }
        }
    });
    
    document.getElementById('telInput').addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
    });
}

async function kayitOl() {
    const ad = document.getElementById('adInput').value.trim();
    const tel = document.getElementById('telInput').value.trim();
    const blok = parseInt(document.getElementById('blokInput').value);
    const daire = parseInt(document.getElementById('daireInput').value);
    const kapi = parseInt(document.getElementById('kapiSelect').value);
    const rol = parseInt(document.getElementById('rolSelect').value);

    if(!ad || !tel || isNaN(blok) || isNaN(daire)) {
        setStatus('s-err', 'Lütfen tüm alanları eksiksiz doldurun.');
        return;
    }

    setStatus('s-wait', 'Kayıt şifreleniyor ve gönderiliyor...');
    document.getElementById('kayitBtn').disabled = true;

    const timestamp = Math.floor(Date.now() / 1000);
    const packet = await Kapibus.buildRegisterPacket(slot, didBase, blok, daire, kapi, rol, tel, ad, timestamp);
    
    const topicKayit = `esp8266/kapi/${chipId}/kayit`;
    client.publish(topicKayit, packet);
    waitingAck = true;
    
    ackTimeout = setTimeout(() => {
        if (waitingAck) {
            setStatus('s-err', 'Sunucudan cevap alınamadı. ESP internete bağlı mı?');
            document.getElementById('kayitBtn').disabled = false;
            waitingAck = false;
        }
    }, 10000);
}

init();
</script>
</body>
</html>
