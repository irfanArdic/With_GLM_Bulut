<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kayıt Ol</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#1a1a2e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.box{background:#16213e;padding:30px;border-radius:16px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3);}
h2{color:#667eea;margin-bottom:20px;}
.sfg{margin-bottom:12px;text-align:left;}
.sfl{font-size:11px;font-weight:700;color:#667eea;margin-bottom:4px;display:block;}
.sfi{width:100%;padding:11px 13px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px;outline:none;font-family:inherit;background:#0f172a;color:#fff;}
.sfi:focus{border-color:#667eea;}
.tel-wrap{display:flex;border:2px solid #e5e7eb;border-radius:10px;overflow:hidden;transition:border .2s;}
.tel-wrap:focus-within{border-color:#667eea;}
.tel-prefix{background:#f5f5f5;color:#555;padding:11px 10px;font-size:15px;font-weight:700;border-right:1px solid #e5e7eb;white-space:nowrap;line-height:1;}
.tel-inp{flex:1;padding:11px 10px;font-size:15px;border:none;outline:none;font-family:inherit;background:transparent;color:#fff;}
.row{display:flex;gap:10px;}
.col{flex:1;}
button{width:100%;padding:13px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:11px;cursor:pointer;font-size:16px;font-weight:700;margin-top:6px;}
button:disabled{opacity:0.5;cursor:not-allowed;}
.msg{padding:10px 12px;border-radius:9px;font-size:13px;margin-top:12px;display:none;}
.msg.err{background:#ffcdd2;color:#c62828;display:block;}
.msg.ok{background:#c8e6c9;color:#1b5e20;display:block;}
.msg.wait{background:#fff9c4;color:#f57f17;display:block;}
</style>
</head>
<body>

<div class="box">
    <h2>📝 Site Sakini Kaydı</h2>
    
    <div class="sfg">
        <label class="sfl">AD SOYAD</label>
        <input type="text" id="adInput" class="sfi" placeholder="Adınızı girin">
    </div>
    
    <div class="sfg">
        <label class="sfl">TELEFON NUMARASI</label>
        <div class="tel-wrap">
            <span class="tel-prefix">+90</span>
            <input type="tel" id="telInput" class="tel-inp" maxlength="10" inputmode="numeric" placeholder="5xx xxx xx xx">
        </div>
    </div>

    <div class="row">
        <div class="col sfg">
            <label class="sfl">BLOK NO</label>
            <input type="number" id="blokInput" class="sfi" value="1">
        </div>
        <div class="col sfg">
            <label class="sfl">DAİRE NO</label>
            <input type="number" id="daireInput" class="sfi" value="1">
        </div>
    </div>
    
    <div class="row">
        <div class="col sfg">
            <label class="sfl">KAPI</label>
            <select id="kapiSelect" class="sfi">
                <option value="1">1. Kapı</option>
                <option value="2">2. Kapı</option>
            </select>
        </div>
        <div class="col sfg">
            <label class="sfl">ROL</label>
            <select id="rolSelect" class="sfi">
                <option value="0">Sakin</option>
                <option value="1">Personel</option>
            </select>
        </div>
    </div>
    
    <button id="kayitBtn" onclick="kayitOl()">Kaydı Tamamla</button>
    
    <div class="msg" id="msg"></div>
</div>

<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script src="kapibus.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const link = urlParams.get('l');
const chipId = urlParams.get('id');
const slot = parseInt(urlParams.get('s') || '0');

let client = null;
let didBase = null;
let deviceIDHex = null;
let waitingAck = false;
let ackTimeout = null;

function setMsg(cls, txt) {
    const m = document.getElementById('msg');
    m.className = 'msg ' + cls;
    m.textContent = txt;
}

async function init() {
    if (!link || !chipId) {
        setMsg('err', 'Hata: Davetiye Linki eksik!');
        document.getElementById('kayitBtn').disabled = true;
        return;
    }

    const deviceID = Array.from(crypto.getRandomValues(new Uint8Array(4)));
    deviceIDHex = Kapibus.bytesToHex(deviceID);
    didBase = await Kapibus.generateDIDBase(link, deviceIDHex);

    client = mqtt.connect('wss://49de32fbb15f4b4ead7a5919fb255492.s1.eu.hivemq.cloud:8884/mqtt', {
        clientId: 'web_reg_' + Math.random().toString(36).substring(2),
        username: 'ESP8266_buton',
        password: 'EDCrfv01'
    });

    const topicYanit = `esp8266/kapi/${chipId}/kayit/yanit/${deviceIDHex}`;

    client.on('connect', () => {
        client.subscribe(topicYanit);
        setMsg('ok', 'Sistem hazır. Bilgilerinizi girip kayıt olun.');
    });

    client.on('message', (topic, message) => {
        const msgBytes = new Uint8Array(message);
        if (waitingAck && msgBytes.length === 1) {
            clearTimeout(ackTimeout);
            waitingAck = false;
            if (msgBytes[0] === 0x01) {
                setMsg('ok', 'Kayıt Başarılı! Artık kapıyı açabilirsiniz.');
                document.getElementById('kayitBtn').disabled = true;
            } else {
                setMsg('err', 'Kayıt Başarısız! Slot dolu veya hatalı.');
                document.getElementById('kayitBtn').disabled = false;
            }
        }
    });
    
    // Telefon numarası formatı
    document.getElementById('telInput').addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
    });
}

async function kayitOl() {
    const ad = document.getElementById('adInput').value.trim();
    const tel = document.getElementById('telInput').value.trim();
    const blok = parseInt(document.getElementById('blokInput').value);
    const daire = parseInt(document.getElementById('daireInput').value);
    const kapi = parseInt(document.getElementById('kapiSelect').value);
    const rol = parseInt(document.getElementById('rolSelect').value);

    if(!ad || !tel || isNaN(blok) || isNaN(daire)) {
        setMsg('err', 'Lütfen tüm alanları eksiksiz doldurun.');
        return;
    }

    setMsg('wait', 'Kayıt şifreleniyor ve gönderiliyor...');
    document.getElementById('kayitBtn').disabled = true;

    const timestamp = Math.floor(Date.now() / 1000);
    const packet = await Kapibus.buildRegisterPacket(slot, didBase, blok, daire, kapi, rol, tel, ad, timestamp);
    
    const topicKayit = `esp8266/kapi/${chipId}/kayit`;
    client.publish(topicKayit, packet);
    waitingAck = true;
    
    // Zaman aşımı: 10 saniye içinde cevap gelmezse uyar
    ackTimeout = setTimeout(() => {
        if (waitingAck) {
            setMsg('err', 'Sunucudan cevap alınamadı. ESP internete bağlı mı?');
            document.getElementById('kayitBtn').disabled = false;
            waitingAck = false;
        }
    }, 10000);
}

init();
</script>
</body>
</html>
