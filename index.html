<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kapi Sistemi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#1a1a2e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.box{background:#16213e;padding:30px;border-radius:16px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3);}
h2{color:#667eea;margin-bottom:20px;}
.status{padding:12px;border-radius:8px;font-size:14px;font-weight:bold;margin-bottom:20px;}
.s-off{background:#f44336;color:#fff;}
.s-wait{background:#ff9800;color:#fff;}
.s-ok{background:#4caf50;color:#fff;}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;font-size:14px;display:none;}
</style>
</head>
<body>

<div class="box">
    <h2>🚪 Kapi Sistemi</h2>
    <div class="status s-off" id="status">Bağlantı Bekleniyor...</div>
    <button class="btn" id="openBtn" disabled>Kapıyı Aç</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script src="kapibus.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const link = urlParams.get('l');
const chipId = urlParams.get('id');

let client = null;
let didBase = null;
let deviceID = null;
let waitingForSeed = false;
let waitingForAck = false;

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
}

function setStatus(cls, msg) {
    const s = document.getElementById('status');
    s.className = 'status ' + cls;
    s.textContent = msg;
}

async function init() {
    if (!link || !chipId) {
        setStatus('s-off', 'Hata: Davetiye Linki eksik!');
        return;
    }

    // Cihaz ID Üret (32 Bit)
    deviceID = Array.from(crypto.getRandomValues(new Uint8Array(4)));
    const deviceIDHex = Kapibus.bytesToHex(deviceID);
    
    // DID_Base Üret (Telefon ve ESP arasında gizli anahtar)
    didBase = await Kapibus.generateDIDBase(link, deviceIDHex);
    console.log('DID_Base:', Kapibus.bytesToHex(didBase));

    setStatus('s-off', 'Sunucuya Bağlanıyor...');

    client = mqtt.connect('wss://49de32fbb15f4b4ead7a5919fb255492.s1.eu.hivemq.cloud:8884/mqtt', {
        clientId: 'web_' + Math.random().toString(36).substring(2),
        username: 'ESP8266_buton',
        password: 'EDCrfv01'
    });

    const topicYanit = `esp8266/kapi/${chipId}/yanit/${deviceIDHex}`;
    const topicKomut = `esp8266/kapi/${chipId}/komut/${deviceIDHex}`;

    client.on('connect', () => {
        setStatus('s-ok', 'Sistem Hazır');
        document.getElementById('openBtn').disabled = false;
        client.subscribe(topicYanit);
    });

    client.on('message', async (topic, message) => {
        const msgBytes = new Uint8Array(message);
        
        // 1. Seed (Soru) Geldi (8 Byte)
        if (waitingForSeed && msgBytes.length === 8) {
            waitingForSeed = false;
            const seed = msgBytes.slice(0, 4);
            
            // MAC Doğrula
            const receivedMac = msgBytes.slice(4, 8);
            const calculatedMac = await Kapibus.generateMAC(didBase, seed, 4);
            
            let match = true;
            for(let i=0; i<4; i++) {
                if(calculatedMac[i] !== receivedMac[i]) { match = false; break; }
            }

            if (match) {
                setStatus('s-wait', 'Kanıt Hesaplanıyor...');
                const ntpTime = Math.floor(Date.now() / 1000);
                const slot = 0; // NOT: Slot numarasını linkten veya kayıt formundan almamız gerekiyor. Şimdilik 0 varsayıyoruz.
                
                const proofPacket = await Kapibus.buildOpenProof(slot, seed, didBase, ntpTime);
                client.publish(topicKomut, proofPacket);
                waitingForAck = true;
                setStatus('s-wait', 'Kapı Açılıyor...');
            } else {
                setStatus('s-off', 'Hata: Geçersiz Sunucu İmzası');
            }
        }
        
        // 2. ACK (Onay) Geldi (8 Byte)
        else if (waitingForAck && msgBytes.length === 8) {
            waitingForAck = false;
            const ackCmd = await Kapibus.verifyAck(msgBytes, didBase);
            
            if (ackCmd === 0x04) {
                setStatus('s-ok', 'Kapı Açıldı! ✅');
                showToast('Kapı Açıldı!');
                // Röle sesi simülasyonu
                setTimeout(() => setStatus('s-ok', 'Sistem Hazır'), 3000);
            } else if (ackCmd === 0x05) {
                setStatus('s-off', 'REDDEDİLDİ! ❌');
                showToast('Erişim Reddedildi.');
            } else {
                setStatus('s-off', 'Hata: Geçersiz Onay');
            }
        }
    });

    client.on('error', () => {
        setStatus('s-off', 'Bağlantı Hatası!');
    });
}

document.getElementById('openBtn').addEventListener('click', async () => {
    if (client && client.connected && !waitingForSeed && !waitingForAck) {
        setStatus('s-wait', 'Soru İsteniyor...');
        waitingForSeed = true;
        
        const topicKomut = `esp8266/kapi/${chipId}/komut/${Kapibus.bytesToHex(didBase)}`;
        const reqPacket = await Kapibus.buildChallengeRequest(0, didBase); // Slot 0
        client.publish(topicKomut, reqPacket);
    }
});

// Başlat
init();
</script>
</body>
</html>
