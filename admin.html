<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bulut Admin Paneli (KapiBus)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#1a1a2e;color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px;min-height:100vh;}
.box{background:#16213e;padding:20px;border-radius:12px;width:100%;max-width:800px;margin-bottom:20px;box-shadow:0 4px 20px rgba(0,0,0,0.3);}
h2{margin-bottom:15px;color:#667eea;}
input{width:100%;padding:10px;margin:5px 0;border-radius:6px;border:1px solid #444;background:#0f172a;color:#fff;}
button{padding:10px 15px;background:#667eea;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin:5px 0;}
button:disabled{opacity:0.5;}
.kart{background:#fff;color:#000;border-radius:8px;padding:12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;}
.link-box{background:#4caf50;color:#fff;padding:10px;border-radius:6px;margin-top:10px;word-break:break-all;font-family:monospace;font-size:12px;display:none;}
</style>
</head>
<body>

<div class="box" id="loginBox">
    <h2>🌐 Bulut Yönetim Paneli</h2>
    <p style="font-size:12px;color:#aaa;margin-bottom:10px;">ESP8266 Cihaz ID (Örn: 00AB253B)</p>
    <input type="text" id="chipIdInput" placeholder="Sistem ID">
    <input type="password" id="passInput" placeholder="Admin Şifre">
    <button onclick="connectMQTT()">Bağlan</button>
</div>

<div class="box" id="panelBox" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px;">
        <h2 id="sysTitle" style="margin:0;">Yükleniyor...</h2>
        <button onclick="generateInvite()">➕ Davetiye Üret (Slot 1)</button>
    </div>
    <div id="inviteBox" class="link-box"></div>
</div>

<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script src="kapibus.js"></script>
<script>
let client = null;
let chipId = "";
let adminPass = "";

function connectMQTT() {
    chipId = document.getElementById('chipIdInput').value.trim();
    adminPass = document.getElementById('passInput').value.trim();
    if(!chipId || !adminPass) { alert("ID ve Şifre girin!"); return; }

    document.getElementById('panelBox').style.display = 'block';
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('sysTitle').innerText = "Bağlanıyor...";

    client = mqtt.connect('wss://49de32fbb15f4b4ead7a5919fb255492.s1.eu.hivemq.cloud:8884/mqtt', {
        clientId: 'admin_' + Math.random().toString(36).substring(2),
        username: 'ESP8266_buton',
        password: 'EDCrfv01'
    });

    client.on('connect', () => {
        document.getElementById('sysTitle').innerText = "Bağlandı: " + chipId;
        // ESP'nin Admin yanıt topic'ini dinle
        client.subscribe(`esp8266/kapi/${chipId}/admin/yanit/#`);
    });

    client.on('message', (topic, message) => {
        const msgBytes = new Uint8Array(message);
        // Eğer gelen mesaj 16 Byte ise ve Davetiye Linki ise
        if(msgBytes.length === 16) {
            const link = new TextDecoder().decode(msgBytes);
            document.getElementById('inviteBox').style.display = 'block';
            document.getElementById('inviteBox').innerHTML = "Davetiye Linki:<br>" + `https://irfanardic.github.io/With_GLM_Bulut/kayit.html?l=${link}&id=${chipId}&s=1`;
        }
    });
}

async function generateInvite() {
    // 0x10 = Davetiye Üret Komutu, Slot 1 için
    const packet = await Kapibus.buildAdminPacket(0x10, 1, adminPass);
    // ESP'nin Admin komut topic'ine yolla
    client.publish(`esp8266/kapi/${chipId}/admin/komut`, packet);
}
</script>
</body>
</html>
